name: Validate Arab Payments Skill Atlas

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python scripts/validate_skill.py
      - name: Validate agent adapters
        run: python scripts/validate_adapters.py
      - name: Validate source watch baseline
        run: python scripts/validate_source_watch.py
      - name: Validate eval scenarios
        run: python scripts/eval_scenarios.py --validate --require-automated-checks
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Secret scan
        run: python scripts/secret_scan.py

  source-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check provider source changes
        id: source_changes
        run: |
          set +e
          python scripts/check_source_changes.py --check
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check provider source links
        id: source_links
        run: |
          set +e
          python scripts/check_source_links.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail when source review is required
        run: |
          if [ "${{ steps.source_changes.outputs.exit_code }}" != "0" ] || [ "${{ steps.source_links.outputs.exit_code }}" != "0" ]; then
            echo "Source watch requires maintainer review."
            echo "source_changes=${{ steps.source_changes.outputs.exit_code }}"
            echo "source_links=${{ steps.source_links.outputs.exit_code }}"
            exit 1
          fi
